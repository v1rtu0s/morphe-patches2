name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - dev

jobs:
  release:
    name: Release & Build
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      issues: write
      pull-requests: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Delete existing tag if present
        run: |
          # Get version from gradle.properties (with or without -SNAPSHOT)
          VERSION=$(cat gradle.properties | grep '^version=' | cut -d= -f2 | tr -d ' ' | sed 's/-SNAPSHOT//')
          TAG="v$VERSION"
          echo "Current version from gradle.properties: $VERSION"
          echo "Checking for tag: $TAG"
          
          # Also check what semantic-release will create by looking at commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            echo "Last tag: $LAST_TAG"
            # Count feat commits since last tag
            FEAT_COUNT=$(git log ${LAST_TAG}..HEAD --oneline --grep="^feat:" 2>/dev/null | wc -l)
            if [ "$FEAT_COUNT" -gt 0 ]; then
              # Minor version bump expected
              SEMVER_TAG=$(echo $LAST_TAG | sed -E 's/v([0-9]+)\.([0-9]+)\.([0-9]+)/v.$((+1)).0/')
              echo "Expected semantic-release tag: $SEMVER_TAG (due to $FEAT_COUNT feat commit(s))"
              # Try to delete the semantic-release tag too
              if git rev-parse "$SEMVER_TAG" >/dev/null 2>&1; then
                echo "Deleting semantic-release tag: $SEMVER_TAG"
                git tag -d "$SEMVER_TAG"
                git push --delete origin "$SEMVER_TAG" 2>/dev/null || true
              elif git ls-remote --tags origin "$SEMVER_TAG" | grep -q "$SEMVER_TAG"; then
                echo "Deleting remote semantic-release tag: $SEMVER_TAG"
                git push --delete origin "$SEMVER_TAG" 2>/dev/null || true
              fi
            fi
          fi
          
          echo "Checking for tag: $TAG"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG found locally, deleting..."
            git tag -d "$TAG"
            git push --delete origin "$TAG" 2>/dev/null || true
          else
            echo "Tag $TAG not found locally, checking remote..."
            if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
              echo "Tag $TAG found on remote, deleting remote..."
              git push --delete origin "$TAG" 2>/dev/null || true
            else
              echo "Tag $TAG not found on remote either"
            fi
          fi

      - name: Run Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Attest Build Provenance
        if: steps.release.outputs.new_release_published == 'true'
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      - name: Build patches artifact (Fallback)
        if: steps.release.outputs.new_release_published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:clean :patches:buildAndroid --no-daemon

      - name: Generate patches list
        if: steps.release.outputs.new_release_published != 'true'
        run: ./gradlew :patches:generatePatchesList --no-daemon

      - name: Upload patches artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patches-mpp
          path: patches/build/libs/patches-*.mpp

