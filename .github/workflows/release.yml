name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - dev

jobs:
  release:
    name: Release & Build
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      issues: write
      pull-requests: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Install dependencies
        run: npm install

      - name: Build patches
        env:
          ORG_GRADLE_PROJECT_gpr_user: ${{ github.actor }}
          ORG_GRADLE_PROJECT_gpr_key: ${{ secrets.MORPHE_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Delete existing tag if present
        run: |
          SEMVER_TAG="v1.2.0"
          echo "Expected semantic-release tag: $SEMVER_TAG"
          
          if git rev-parse "$SEMVER_TAG" >/dev/null 2>&1; then
            echo "Deleting semantic-release tag locally: $SEMVER_TAG"
            git tag -d "$SEMVER_TAG"
            git push --delete origin "$SEMVER_TAG" 2>/dev/null || true
          elif git ls-remote --tags origin "$SEMVER_TAG" | grep -q "$SEMVER_TAG"; then
            echo "Deleting remote semantic-release tag: $SEMVER_TAG"
            git push --delete origin "$SEMVER_TAG" 2>/dev/null || true
          fi

      - name: Fetch Git notes for semantic-release
        run: |
          git fetch origin refs/notes/semantic-release-v1.2.0:refs/notes/semantic-release-v1.2.0 2>/dev/null || true

      - name: Run Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Attest Build Provenance
        if: steps.release.outputs.new_release_published == 'true'
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      - name: Upload patches artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patches-mpp
          path: patches/build/libs/patches-*.mpp

      - name: Create or update release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.2.0"
          if gh release view "$TAG" --repo v1rtu0s/morphe-patches2 >/dev/null 2>&1; then
            echo "Release $TAG exists, deleting and recreating"
            gh release delete "$TAG" --repo v1rtu0s/morphe-patches2 --yes
          fi
          gh release create "$TAG" \
            --repo v1rtu0s/morphe-patches2 \
            --title "Release $TAG" \
            --notes "Automated release" \
            patches/build/libs/patches-*.mpp
